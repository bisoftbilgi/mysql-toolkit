[package]
name = "mysql_logger"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
chrono = "0.4"
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "chrono"] }
config = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0" 
